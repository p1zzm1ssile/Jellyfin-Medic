# Builds and releases Medic Posters when you push a tag like film-posters-v1.0.0,
# then adds it to manifest.json beside Jellyfin Medic.
# Jellyfin Medic keeps its own release.yml and its v1.x.x tags; this file doesn't touch them.
# Medic Posters releases are never marked "Latest", so the repo page keeps showing Jellyfin Medic.

name: Release Medic Posters

on:
  push:
    tags:
      - 'film-posters-v*'

permissions:
  contents: write

# Shared with the other releases, so their manifest.json pushes take turns, every run waiting for
# its turn ("queue: max", see release.yml).
concurrency:
  group: manifest-update
  cancel-in-progress: false
  queue: max

env:
  PROJECT: 'Jellyfin.Plugin.MedicPosters/Jellyfin.Plugin.MedicPosters.csproj'
  CHANGELOG_FILE: 'Jellyfin.Plugin.MedicPosters/CHANGELOG.md'
  DLL: 'Jellyfin.Plugin.MedicPosters.dll'
  GUID: 'f8a6666f-5278-45ae-8e5d-abcec99de310'
  NAME: 'Medic Posters'
  OWNER: 'P1zzm1ssile'
  TARGET_ABI: '12.0.0.0'   # built against Jellyfin 12.0, so it loads on 12.0 and 12.1
  DESCRIPTION: "Animated posters for films and series, and animated library covers, made from moments of your videos."
  OVERVIEW: "Small animated GIF posters for films and series, and wide animated covers for libraries, cut from moments of your videos with the title in a big serif font and a rounded white frame. Each item's own picture is kept and can be put back."
  IMAGE: 'https://raw.githubusercontent.com/P1zzm1ssile/Jellyfin-Medic/main/Jellyfin.Plugin.MedicPosters/thumb.png'

jobs:
  # Unit and end-to-end tests first: nothing is released or added to the manifest unless they pass.
  tests:
    uses: ./.github/workflows/tests.yml

  release:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Version from the tag
        id: meta
        shell: bash
        run: |
          VER="${GITHUB_REF_NAME#film-posters-v}"
          # Digits and dots only: the version ends up in file names, commands and the manifest.
          if ! [[ "$VER" =~ ^[0-9]+(\.[0-9]+){2,3}$ ]]; then
            echo "::error::Tag must look like film-posters-v1.2.3 (got $GITHUB_REF_NAME)"
            exit 1
          fi
          IFS='.' read -r A B C D <<< "$VER"
          VER4="${A:-0}.${B:-0}.${C:-0}.${D:-0}"
          echo "version=$VER4" >> "$GITHUB_OUTPUT"
          echo "zip=MedicPosters-v${VER}.zip" >> "$GITHUB_OUTPUT"
          if [ "${A:-0}" = "0" ]; then echo "prerelease=true"; else echo "prerelease=false"; fi >> "$GITHUB_OUTPUT"

      - name: Check the tag matches the project version
        shell: bash
        env:
          WANT: ${{ steps.meta.outputs.version }}
        run: |
          HAVE="$(grep -oP '(?<=<Version>)[^<]+' "$PROJECT" | head -1)"
          if [ "$WANT" != "$HAVE" ]; then
            echo "::error::Tag $GITHUB_REF_NAME is $WANT but $PROJECT says $HAVE. Tag the commit that has the new version."
            exit 1
          fi
          # And it must be on main: a branch that already has the new version but isn't merged would pass the check above.
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME is on a commit that isn't on main. Merge first, then tag the merged commit."
            exit 1
          fi
          # The release notes and the manifest's changelog are this version's section of the changelog.
          if ! python3 scripts/changelog_section.py "$CHANGELOG_FILE" "${GITHUB_REF_NAME#film-posters-v}" > CHANGES.md; then
            echo "::error::$CHANGELOG_FILE has no section for ${GITHUB_REF_NAME#film-posters-v}. Add it, merge, then tag."
            exit 1
          fi

      # Anyone besides the owner whose pull requests went into this release gets a line of thanks in the
      # release notes and the manifest's changelog. A failure here only leaves the line out.
      - name: Thank contributors
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if CREDITS=$(python3 scripts/release_credits.py "$GITHUB_REF_NAME" --changes CHANGES.md); then
            if [ -n "$CREDITS" ]; then printf '\n%s\n' "$CREDITS" >> CHANGES.md; echo "$CREDITS"; fi
          else
            echo "::warning::Couldn't work out who to thank, so these release notes have no credits. Run the Refresh release notes workflow for $GITHUB_REF_NAME once this release is out."
          fi

      - name: Build
        shell: bash
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          dotnet publish "$PROJECT" -c Release -o out \
            -p:JellyfinTarget=12 \
            -p:Version="$VERSION" \
            -p:AssemblyVersion="$VERSION" \
            -p:FileVersion="$VERSION"

      - name: Package
        id: pkg
        shell: bash
        env:
          ZIP: ${{ steps.meta.outputs.zip }}
        run: |
          zip -j "$ZIP" "out/$DLL"
          echo "md5=$(md5sum "$ZIP" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.meta.outputs.version }}
          ZIP: ${{ steps.meta.outputs.zip }}
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
        run: |
          PRE=""
          [ "$PRERELEASE" = "true" ] && PRE="--prerelease"
          # The release may already exist if it was made on GitHub's Releases page (which creates
          # the tag): then add the zip to it and fill in its title and notes instead.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$ZIP" --clobber
            gh release edit "$GITHUB_REF_NAME" --title "$NAME $VERSION" \
              --notes-file CHANGES.md --latest=false $PRE
          else
            gh release create "$GITHUB_REF_NAME" "$ZIP" \
              --title "$NAME $VERSION" \
              --notes-file CHANGES.md --latest=false $PRE
          fi

      - name: Add the version to manifest.json on main
        shell: bash
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          ZIP: ${{ steps.meta.outputs.zip }}
          MD5: ${{ steps.pkg.outputs.md5 }}
        run: |
          git fetch origin main
          git checkout -B main origin/main
          python3 scripts/update_manifest.py \
            --guid "$GUID" \
            --name "$NAME" \
            --version "$VERSION" \
            --abi "$TARGET_ABI" \
            --url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/$ZIP" \
            --checksum "$MD5" \
            --changelog-file CHANGES.md \
            --owner "$OWNER" \
            --description "$DESCRIPTION" \
            --overview "$OVERVIEW" \
            --image-url "$IMAGE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git commit -m "manifest: $NAME $VERSION"
          # Fail if no push gets through, instead of ending green on the last pull's status.
          for _ in 1 2 3; do
            if git push origin main; then exit 0; fi
            git pull --rebase origin main
          done
          echo "::error::Couldn't push manifest.json to main after 3 tries; this release isn't in the manifest."
          exit 1
