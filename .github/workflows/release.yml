name: Build and Release

# Push a version tag to build, release and update the manifest:
#   v1.0.0  ->  builds Jellyfin Medic 1.0.0, creates the release, adds it to manifest.json
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

# Shared with the Picks and Profiles releases, so their manifest.json pushes take turns. "queue: max"
# lets every run wait for its turn: with the default queue, a newer run cancels the one already waiting.
concurrency:
  group: manifest-update
  cancel-in-progress: false
  queue: max

# What the plugin catalogue shows, written to manifest.json by scripts/update_manifest.py (the same
# script the Picks and Profiles releases use).
env:
  GUID: '8d1f5c2e-6b4a-4f7e-9c3d-2a7b5e1f0c94'
  NAME: 'Jellyfin Medic'
  OWNER: 'P1zzm1ssile'
  TARGET_ABI: '12.1.0.0'
  DESCRIPTION: "Health checks, performance tests and usage-aware task scheduling for your Jellyfin server."
  OVERVIEW: "Keeps a busy Jellyfin server healthy: checks, tests and smart scheduling."
  IMAGE: 'https://raw.githubusercontent.com/P1zzm1ssile/Jellyfin-Medic/main/src/JellyfinMedic/thumb.png'

jobs:
  # Unit and end-to-end tests first: nothing is released or added to the manifest unless they pass.
  tests:
    uses: ./.github/workflows/tests.yml

  release:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the tagged code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Work out the version
        id: meta
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Tag must look like v1.2.3 (got $GITHUB_REF_NAME)"; exit 1
          fi
          # The tag must sit on the code for that version: tagging before merging would otherwise
          # publish the previous version's code under the new number.
          IN_CODE=$(grep -oP '(?<=<AssemblyVersion>)[0-9.]+(?=</AssemblyVersion>)' src/JellyfinMedic/JellyfinMedic.csproj)
          if [ "$IN_CODE" != "$VERSION.0" ]; then
            echo "::error::Tag $GITHUB_REF_NAME is on a commit whose code is version $IN_CODE. Merge the release first, then tag the merged commit (delete this tag with: git push origin :refs/tags/$GITHUB_REF_NAME)."; exit 1
          fi
          # And it must be on main: a branch that already has the new version but isn't merged would pass the check above.
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME is on a commit that isn't on main. Merge first, then tag the merged commit."; exit 1
          fi
          # The release notes and the manifest's changelog are this version's CHANGELOG section.
          if ! python3 scripts/changelog_section.py CHANGELOG.md "$VERSION" > CHANGES.md; then
            echo "::error::CHANGELOG.md has no section for $VERSION. Add it, merge, then tag."; exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # Anyone besides the owner whose pull requests went into this release gets a line of thanks in the
      # release notes and the manifest's changelog. A failure here only leaves the line out.
      - name: Thank contributors
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if CREDITS=$(python3 scripts/release_credits.py "$GITHUB_REF_NAME" --changes CHANGES.md); then
            if [ -n "$CREDITS" ]; then printf '\n%s\n' "$CREDITS" >> CHANGES.md; echo "$CREDITS"; fi
          else
            echo "::warning::Couldn't work out who to thank, so these release notes have no credits. Run the Refresh release notes workflow for $GITHUB_REF_NAME once this release is out."
          fi

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: >
          dotnet publish src/JellyfinMedic/JellyfinMedic.csproj -c Release -o publish/JellyfinMedic
          -p:Version=$VERSION -p:AssemblyVersion=$VERSION.0 -p:FileVersion=$VERSION.0

      # Only the plugin's own DLL goes in the zip. Jellyfin already has its own DLLs, and
      # shipping copies of them breaks the plugin's page and background services.
      - name: Package
        id: package
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          ZIP="JellyfinMedic-v$VERSION.zip"
          zip -j "$ZIP" publish/JellyfinMedic/JellyfinMedic.dll
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "md5=$(md5sum "$ZIP" | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Build release notes from CHANGELOG
        env:
          MD5: ${{ steps.package.outputs.md5 }}
        run: |
          cp CHANGES.md RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md
          echo "MD5 checksum: \`$MD5\`" >> RELEASE_NOTES.md

      - name: Create GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          name: Jellyfin Medic ${{ steps.meta.outputs.version }}
          files: ${{ steps.package.outputs.zip }}
          body_path: RELEASE_NOTES.md

      - name: Add this version to manifest.json
        env:
          VERSION: ${{ steps.meta.outputs.version }}.0
          SOURCE_URL: https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/${{ steps.package.outputs.zip }}
          CHECKSUM: ${{ steps.package.outputs.md5 }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B main origin/main
          python3 scripts/update_manifest.py \
            --guid "$GUID" \
            --name "$NAME" \
            --version "$VERSION" \
            --abi "$TARGET_ABI" \
            --url "$SOURCE_URL" \
            --checksum "$CHECKSUM" \
            --changelog-file CHANGES.md \
            --owner "$OWNER" \
            --description "$DESCRIPTION" \
            --overview "$OVERVIEW" \
            --image-url "$IMAGE"
          git add manifest.json
          git commit -m "chore: add $VERSION to manifest"
          # Fail if no push gets through, instead of ending green on the last pull's status.
          for _ in 1 2 3; do
            if git push origin main; then exit 0; fi
            git pull --rebase origin main
          done
          echo "::error::Couldn't push manifest.json to main after 3 tries; this release isn't in the manifest."; exit 1
